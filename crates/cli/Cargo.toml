[package]
name = "tachyon-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tachyon"
path = "src/main.rs"

[dependencies]
tachyon-core = { path = "../core" }
clap = { version = "4", features = ["derive", "env"] }
serde.workspace = true
serde_json = "1"
toml = "0.8"
hex.workspace = true
ed25519-dalek.workspace = true
anyhow = "1"
ureq = { version = "2", features = ["json"] }
dirs = "5"
sha2.workspace = true
rand = "0.8"
