name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: chronyx-x86_64-linux
          - os: macos-latest
            target: aarch64-apple-darwin
            name: chronyx-aarch64-macos
          - os: macos-latest
            target: x86_64-apple-darwin
            name: chronyx-x86_64-macos
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: chronyx-x86_64-windows

    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --workspace --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          src="target/${{ matrix.target }}/release"
          dist="dist/${{ matrix.name }}"
          mkdir -p "$dist"
          cp README.md LICENSE "$dist/"

          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "$src/chronyx.exe" "$src/chronyxd.exe" "$dist/"
            7z a -tzip "dist/${{ matrix.name }}.zip" "$dist" > /dev/null
          else
            cp "$src/chronyx" "$src/chronyxd" "$dist/"
            tar -czf "dist/${{ matrix.name }}.tar.gz" -C dist "${{ matrix.name }}"
          fi

          rm -rf "$dist"
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Collect
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
