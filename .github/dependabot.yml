version: 2
updates:
  # Cargo versions are handled by `cargo audit` in security.yml plus manual
  # upgrades. Dependabot's semver logic treats every 0.x minor as compatible,
  # which turns into a wall of red PRs that do not compile.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
