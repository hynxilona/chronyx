[workspace]
resolver = "2"
members = ["crates/core", "crates/node", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
ed25519-dalek = { version = "3", features = ["serde", "rand_core"] }
hex = "0.4"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3
